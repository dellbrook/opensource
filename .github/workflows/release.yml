# Changesets' release workflow (https://changesets.dev/guide/automating),
# with mise for the toolchain, publishing to GitHub Packages
# (npm.pkg.github.com) with the job's GITHUB_TOKEN: no stored secrets.
# On every push to main, select-mode picks one of:
# - version: there are changesets, so open or update the "Version Packages"
#   PR, which bumps versions and writes each package's CHANGELOG.md.
# - publish: that PR was merged, so pack every package whose version isn't
#   in the registry yet and publish it, with a git tag and GitHub release
#   for each.
# - none: nothing to do.
# Every push that isn't a release also publishes a per-commit version of the
# packages it changed, under the `main` dist-tag (`snapshot`).
# See RELEASING.md.
name: release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  select-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read
      packages: read # which versions are already published
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No caches in this workflow: a cache another branch's run wrote must
      # not reach a publish.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: false
      - run: mise run install
      - uses: ./.github/actions/registry-auth
      - id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commit the version bumps
      pull-requests: write # open the "Version Packages" PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: false
      - run: mise run install
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  # A per-commit version of each package this push changed (and of its
  # dependents), e.g. 0.1.1-main.20261010.42.gabc1234, under the `main`
  # dist-tag: scripts/snapshot.ts. Not on a release push, which publishes
  # the real versions instead.
  snapshot:
    if: needs.select-mode.outputs.mode != 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # publish to GitHub Packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The diff against the previous main commit, however many commits
          # the push brought.
          fetch-depth: 0
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: false
      # Everything CI checks, then build: nothing is published that CI
      # wouldn't pass.
      - run: mise run ci
      - uses: ./.github/actions/registry-auth
      - run: node scripts/snapshot.ts ${SINCE:+--since "$SINCE"}
        env:
          # Empty for a branch's first push: then every package.
          SINCE: ${{ github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '' }}
          NODE_AUTH_TOKEN: ${{ github.token }}

  pack:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: false
      # Everything CI checks, then build: nothing is published that CI
      # wouldn't pass.
      - run: mise run ci
      - id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  # Only this job can publish, and it runs no build: it publishes the
  # tarballs `pack` made.
  publish:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # git tags and GitHub releases
      packages: write # publish to GitHub Packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: false
      - run: mise run install
      - uses: ./.github/actions/registry-auth
      - uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
